services:
  - type: web
    name: athena
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.hosted
    healthCheckPath: /
    autoDeployTrigger: off
    envVars:
      - key: MODEL_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-5.4-2026-03-05
      - key: OPENAI_API_KEY
        sync: false
      - key: DEMO_ACCESS_CODE
        sync: false
      - key: DEMO_SESSION_SECRET
        generateValue: true
      - key: MODEL_TURNS_PER_HOUR
        value: '120'
      - key: PORT
        value: '10000'
