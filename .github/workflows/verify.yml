name: Verify Athena

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  OPENAI_API_KEY: ''
  OPENAI_MODEL: ''

jobs:
  deterministic:
    name: Build and test against FalkorDB 4.22.1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      graph:
        # Keep this exact image aligned with compose.yaml.
        image: falkordb/falkordb:v4.22.1@sha256:b0bdcac2cbaff989e77cb0610439b7a9289e86de033ccbbd4368b66fb680ae7a
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 2s
          --health-retries 20
    env:
      FALKORDB_HOST: 127.0.0.1
      FALKORDB_PORT: '16379'
      FALKORDB_GRAPH: athena_ci
      FALKORDB_PASSWORD: ''
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Build production web application
        run: npm run build
      - name: Run deterministic unit tests
        run: npm test
      - name: Run HTTP and real graph integration tests
        run: npm run test:integration

  container-smoke:
    name: Build containers and check the cold browser flow
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: athena-ci-${{ github.run_id }}-${{ github.run_attempt }}
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate local demo credentials without a model key
        id: setup
        run: |
          npm run setup
          node --env-file=.env -e '
            for (const key of ["WORKSPACE_LAB_TOKEN", "WORKSPACE_LAB_ADMIN_TOKEN", "DEMO_SESSION_SECRET"]) {
              if (!process.env[key]) throw new Error(`${key} was not generated`);
              process.stdout.write(`::add-mask::${process.env[key]}\n`);
            }
            if (process.env.OPENAI_API_KEY || process.env.OPENAI_MODEL) throw new Error("The cold smoke test must not use a model");
          '
      - name: Build and start the isolated Compose project
        run: docker compose --project-name "$COMPOSE_PROJECT_NAME" up --build --detach --wait --wait-timeout 120
      - name: Wait for application readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 3 http://127.0.0.1:4100/health >/dev/null &&
               curl --fail --silent --max-time 3 http://127.0.0.1:3100/ >/dev/null &&
               docker compose --project-name "$COMPOSE_PROJECT_NAME" exec -T workspace-lab node -e 'fetch("http://127.0.0.1:4200/health", { signal: AbortSignal.timeout(3000) }).then(response => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo '::error::The Compose applications did not become ready.'
          exit 1
      - name: Install the pinned Playwright Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Check the cold browser flow without a model
        run: npm run test:e2e -- cold.spec.ts
      - name: Collect sanitized Compose diagnostics
        if: ${{ always() && steps.setup.outcome == 'success' }}
        run: |
          docker compose --project-name "$COMPOSE_PROJECT_NAME" ps --all
          docker compose --project-name "$COMPOSE_PROJECT_NAME" logs --no-color --tail 200 2>&1 | node --env-file=.env -e '
            let logs = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", chunk => { logs += chunk; });
            process.stdin.on("end", () => {
              for (const key of ["WORKSPACE_LAB_TOKEN", "WORKSPACE_LAB_ADMIN_TOKEN", "DEMO_SESSION_SECRET", "OPENAI_API_KEY", "GEMINI_API_KEY", "DEMO_ACCESS_CODE"]) {
                const value = process.env[key];
                if (value) logs = logs.split(value).join("[REDACTED]");
              }
              process.stdout.write(logs);
            });
          '
      - name: Remove only this job's containers and volumes
        if: ${{ always() && steps.setup.outcome == 'success' }}
        run: docker compose --project-name "$COMPOSE_PROJECT_NAME" down --volumes --remove-orphans

  hosted-smoke:
    name: Check the free hosted container under its resource limits
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ATHENA_HOSTED_TEST: '1'
      PLAYWRIGHT_BASE_URL: https://127.0.0.1:3443
      DEMO_ACCESS_CODE: ci-only-hosted-entry-not-a-production-secret
      GEMINI_API_KEY: ''
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - name: Install test dependencies
        run: npm ci --no-audit --no-fund
      - name: Build the hosted image
        run: docker build --file Dockerfile.hosted --tag athena-hosted-ci .
      - name: Start with 512 MB RAM and 0.1 CPU
        run: >-
          docker run --detach --name athena-hosted-ci --memory 512m --memory-swap 512m --cpus 0.1
          --publish 127.0.0.1:10000:10000 --env DEMO_ACCESS_CODE
          --env APP_PUBLIC_ORIGIN=https://127.0.0.1:3443
          --env MODEL_PROVIDER=gemini --env GEMINI_MODEL=gemini-3.8-flash athena-hosted-ci
      - name: Terminate HTTPS as the hosting platform does
        run: |
          mkdir -p .local/ci-tls
          openssl req -x509 -newkey rsa:2048 -nodes -keyout .local/ci-tls/key.pem -out .local/ci-tls/cert.pem -days 1 -subj '/CN=127.0.0.1' -addext 'subjectAltName=IP:127.0.0.1' >/dev/null 2>&1
          node tests/support/hosted-proxy.mjs >.local/ci-tls/proxy.log 2>&1 &
          for attempt in $(seq 1 180); do
            if curl --insecure --fail --silent --max-time 3 https://127.0.0.1:3443/api/health >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check hosted browser access and origin boundaries without a model
        run: npm run test:e2e -- hosted.spec.ts
      - name: Report resources and service logs
        if: always()
        run: |
          docker stats --no-stream athena-hosted-ci || true
          docker exec athena-hosted-ci cat /sys/fs/cgroup/memory.peak || true
          docker logs --tail 100 athena-hosted-ci || true
      - name: Remove this job's container
        if: always()
        run: docker rm --force athena-hosted-ci || true
